services:
  
  mongodb:
    image: mongo:6
    container_name: rag_mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo_data:/data/db

    networks:
      - rag_network



  qdrant:
    image: qdrant/qdrant
    container_name: rag_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - rag_network



  fastapi:
    build:
      context: ../src
      dockerfile: Dockerfile

    container_name: rag_api
    restart: unless-stopped

    ports:
      - "5000:5000"

    depends_on:
      - mongodb
      - qdrant

    env_file:
      - ../src/.env

    volumes:
      - ../src:/app

    networks:
      - rag_network



volumes:
  mongo_data:
  qdrant_data:



networks:
  rag_network:
    driver: bridge